<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/url_logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sakshi Hi-Tech Nursery | Premium Quality Vegetable Plants & Seedlings</title>
    <meta name="description" content="Sakshi Hi-Tech Nursery provides premium quality vegetable plants, healthy seedlings, and high-tech agricultural infrastructure in Maharashtra." />
    <meta name="keywords" content="Sakshi Nursery, Hi-Tech Nursery, Vegetable Seedlings, Papaya Plants, Watermelon Plants, Tomato Seedlings, High Tech Agriculture" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://sakshinursery.com/" />

    <!-- Open Graph / WhatsApp / Facebook Preview -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Sakshi Hi-Tech Nursery - Carefully Grown. Beautifully Delivered." />
    <meta property="og:description" content="Explore healthy, high-yield vegetable plants & high-tech nursery infrastructure." />
    <meta property="og:image" content="/url_logo.png" />

    <!-- Structured Data (JSON-LD) for Local Business & Nursery -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Sakshi Hi-Tech Nursery",
        "image": "https://sakshinursery.com/url_logo.png",
        "url": "https://sakshinursery.com",
        "telephone": "+91-9876543210",
        "priceRange": "₹",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Sangamner",
          "addressRegion": "Maharashtra",
          "addressCountry": "IN"
        },
        "description": "Sakshi Hi-Tech Nursery provides premium quality high-yield vegetable seedlings, fruit plants, and high-tech agricultural nursery infrastructure."
      }
    </script>

    <!-- Preconnect & Font Optimization -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
      @keyframes blinker {
        50% {
          opacity: 0;
        }
      }

      .blink {
        animation: blinker 1s linear infinite;
      }

      /* Hide Google Translate top banner & tooltip popups */
      .goog-te-banner-frame, 
      .skiptranslate > iframe, 
      #goog-gt-tt,
      .goog-te-balloon-frame {
        display: none !important;
      }

      body {
        top: 0px !important;
        position: static !important;
      }

      /* Custom styling for Google Translate element */
      .goog-te-gadget {
        font-family: inherit !important;
        color: transparent !important;
        font-size: 0px !important;
        line-height: 1 !important;
      }

      .goog-te-gadget span {
        display: none !important;
      }

      .goog-te-gadget .goog-te-combo {
        background-color: #14532d;
        color: #fde047;
        border: 1px solid rgba(253, 224, 71, 0.4);
        border-radius: 9999px;
        padding: 4px 10px;
        font-size: 12px;
        font-weight: 700;
        outline: none;
        cursor: pointer;
        transition: all 0.2s ease-in-out;
      }

      .goog-te-gadget .goog-te-combo:hover {
        background-color: #166534;
        border-color: #fde047;
        box-shadow: 0 0 10px rgba(253, 224, 71, 0.3);
      }
    </style>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
